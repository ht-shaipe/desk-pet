<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desk Pet</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }

      #card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: linear-gradient(160deg, rgba(24, 26, 34, 0.94), rgba(15, 16, 22, 0.96));
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        position: relative;
        cursor: pointer;
        animation: card-in 0.32s cubic-bezier(0.34, 1.3, 0.64, 1);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }

      #card.hidden {
        display: none;
      }

      #title {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(120deg, #8ec5ff, #b79bff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      #message {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.78);
        letter-spacing: 1px;
      }

      #hint {
        margin-top: 8px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
      }

      #close {
        position: absolute;
        top: 10px;
        right: 12px;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: rgba(255, 255, 255, 0.45);
        font-size: 15px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease;
      }

      #close:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="card" class="hidden">
      <button id="close" aria-label="关闭">✕</button>
      <div id="title"></div>
      <div id="message"></div>
      <div id="hint"></div>
    </div>
    <script type="module" src="/src/notify-main.ts"></script>
  </body>
</html>
