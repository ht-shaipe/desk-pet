[package]
name = "channel-client"
version = "0.1.0"
description = "应用通道客户端：gRPC 双向长连接封装（自 kit/channel 搬入，随仓库分发保证 CI/他机可构建）"
edition = "2024"
license = "MIT"

[dependencies]
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["sync"] }
thiserror = "2"
