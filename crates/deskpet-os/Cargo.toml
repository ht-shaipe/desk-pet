[package]
name = "deskpet-os"
version = "0.1.0"
description = "Desk Pet 系统交互层：应用启动、快捷操作、剪贴板访问、文件落盘，不依赖 Tauri"
edition = "2024"

[dependencies]
serde = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
plist = { workspace = true }
fs4 = { workspace = true }
image = { workspace = true }
webp = { workspace = true }
png = { workspace = true }
color_quant = { workspace = true }
fast_image_resize = { workspace = true }
gif = { workspace = true }
ab_glyph = { workspace = true }
sysinfo = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "multipart", "stream", "cookies"] }
tokio = { version = "1", default-features = false, features = ["fs"] }
url = "2"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
cookie_store = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSStatusBar", "NSStatusItem", "NSButton", "NSControl", "NSResponder", "NSStatusBarButton", "NSView", "NSFont", "NSImage", "objc2-core-foundation"] }
objc2-core-foundation = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData"] }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = "1"
