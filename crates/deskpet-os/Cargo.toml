[package]
name = "deskpet-os"
version = "0.1.0"
description = "Desk Pet 系统交互层：应用启动、快捷操作、剪贴板访问、文件落盘，不依赖 Tauri"
edition = "2024"

[dependencies]
serde = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
plist = { workspace = true }
fs4 = { workspace = true }
image = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData"] }

[dev-dependencies]
tempfile = { workspace = true }
