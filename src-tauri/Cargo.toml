[package]
name = "desk-pet"
version = "0.1.27"
description = "Desk Pet 桌面精灵：可拖拽的置顶桌面宠物，内置应用启动器与实用小工具"
authors = ["shaipe"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "desk_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
walkdir = { workspace = true }
kamadak-exif = { workspace = true }
blake3 = { workspace = true }
trash = { workspace = true }
image = { workspace = true }
fast_image_resize = { workspace = true }
axum = "0.8"
# rt/macros：channel 运行时使用 tokio::select! 与 spawn_blocking；process/io-util：MCP stdio 传输
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros", "process", "io-util"] }
tokio-stream = "0.1"
# MCP 官方 Rust SDK：client + stdio（子进程）/ streamable HTTP 两种客户端传输
rmcp = { version = "0.8", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# dangerous-settings：允许 http::fetch 传入 danger 配置（仅用于本地/内网自签名证书的回退请求）
tauri-plugin-http = { version = "2.8.3", features = ["dangerous-settings"] }
tauri-plugin-dialog = "2"
# anydoc：任意格式文档转 Markdown（PDF/DOCX/XLSX/PPTX/EPUB/ODT/CSV 等，纯 Rust，MIT）
anydoc = "0.2.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
deskpet-store = { path = "../crates/deskpet-store" }
deskpet-os = { path = "../crates/deskpet-os" }
deskpet-disk = { path = "../crates/deskpet-disk" }
# gRPC 实时通道客户端（自 kit/channel 搬入 workspace，协议契约见 crates/channel-client/proto）
channel-client = { path = "../crates/channel-client" }
uuid = { version = "1", features = ["v4"] }
similar = { version = "3.2.1", features = ["unicode"] }
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-yaml = "0.7.2"

[dev-dependencies]
tempfile = { workspace = true }
# test feature：tauri::test::mock_app，供 AI 用量扫描等需要 AppHandle 的逻辑做离线集成测试
tauri = { version = "2", features = ["test"] }
# 测试 fixture：构造 opencode.db 样本（与 deskpet-store 同版本，不引入新 crate）
rusqlite = { workspace = true }
