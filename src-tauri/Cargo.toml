[package]
name = "desk-pet"
version = "0.1.0"
description = "Desk Pet 桌面精灵：可拖拽的置顶桌面宠物，内置应用启动器与实用小工具"
authors = ["shaipe"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "desk_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
serde = { workspace = true }
serde_json = { workspace = true }
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-http = "2.8.3"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
deskpet-store = { path = "../crates/deskpet-store" }
deskpet-os = { path = "../crates/deskpet-os" }
