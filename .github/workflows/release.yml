name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，纯 semver，不要加 v 前缀（如 0.2.0；填 v0.2.0 也会自动清洗）'
        required: true

jobs:
  publish:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install frontend deps
        shell: bash
        run: npm install

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # 规范化：去掉可能的 v 前缀与首尾空白，保证是合法 semver
          VERSION=$(printf '%s' "$VERSION" | sed 's/^v//' | tr -d '[:space:]')
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Determined version '$VERSION' is not a valid semver (expect e.g. 0.1.1, do NOT include a leading v)"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync tauri version
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(j,null,2));"
          echo "tauri.conf.json version synced to $APP_VERSION"

      - name: Pre-create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          # 幂等创建：多平台并发时可能已被其他 job 创建，忽略冲突
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --title "Desk Pet v${{ steps.ver.outputs.version }}" \
              --notes "See the assets below to download and install this version." \
              --draft=false 2>&1 || true
          fi
          echo "Release $TAG ready"

      - name: Build Tauri app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          TARGET="${{ matrix.target }}"
          BUNDLE_DIR="target/${TARGET}/release/bundle"

          echo "=== Collecting artifacts for $TARGET ==="
          FILES=()

          # macOS: .app.tar.gz + .sig（两个 target 同名，按架构重命名避免互相覆盖），.dmg
          if [ "${{ runner.os }}" = "macOS" ]; then
            ARCH_SUFFIX=""
            case "$TARGET" in
              aarch64-apple-darwin) ARCH_SUFFIX="-aarch64" ;;
              x86_64-apple-darwin)  ARCH_SUFFIX="-x86_64" ;;
            esac
            for f in "$BUNDLE_DIR"/macos/*.tar.gz "$BUNDLE_DIR"/macos/*.tar.gz.sig; do
              if [ -f "$f" ]; then
                BASENAME=$(basename "$f")
                if [[ "$BASENAME" == *.sig ]]; then
                  ROOT="${BASENAME%.sig}"
                  ROOTNAME="${ROOT%.app.tar.gz}"
                  NEWNAME="${ROOTNAME}${ARCH_SUFFIX}.app.tar.gz.sig"
                else
                  ROOTNAME="${BASENAME%.app.tar.gz}"
                  NEWNAME="${ROOTNAME}${ARCH_SUFFIX}.app.tar.gz"
                fi
                cp "$f" "/tmp/$NEWNAME"
                FILES+=("/tmp/$NEWNAME")
              fi
            done
            for f in "$BUNDLE_DIR"/dmg/*.dmg; do
              [ -f "$f" ] && FILES+=("$f")
            done
          fi
          # Windows: .tar.gz + .sig（updater 用），.msi，.exe（nsis）
          if [ "${{ runner.os }}" = "Windows" ]; then
            for f in "$BUNDLE_DIR"/msi/*.tar.gz "$BUNDLE_DIR"/msi/*.tar.gz.sig \
                     "$BUNDLE_DIR"/msi/*.msi "$BUNDLE_DIR"/nsis/*.exe; do
              [ -f "$f" ] && FILES+=("$f")
            done
          fi

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No bundle artifacts found in $BUNDLE_DIR"
            find "$BUNDLE_DIR" -type f 2>/dev/null || echo "(bundle dir empty)"
            exit 1
          fi

          echo "Uploading ${#FILES[@]} file(s) to $TAG:"
          printf '  %s\n' "${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "${{ github.repository }}"
          echo "OK Upload complete"

      - name: Upload updater manifest fragment
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          VERSION="${{ steps.ver.outputs.version }}"
          TARGET="${{ matrix.target }}"
          REPO="${{ github.repository }}"
          BUNDLE_DIR="target/${TARGET}/release/bundle"

          case "$TARGET" in
            aarch64-apple-darwin)    PLATFORM_KEY="darwin-aarch64" ;;
            x86_64-apple-darwin)     PLATFORM_KEY="darwin-x86_64" ;;
            x86_64-pc-windows-msvc)  PLATFORM_KEY="windows-x86_64" ;;
            *) echo "::error::Unknown target $TARGET"; exit 1 ;;
          esac

          # 确定性取签名文件：
          # - macOS：bundle 下唯一的 .sig（.app.tar.gz.sig）
          # - Windows：明确取 nsis 的 setup.exe.sig（Tauri v2 下安装包本体即 updater 产物，
          #   msi 与 nsis 各有 .sig，不能 find|head -1 碰运气）
          if [ "${{ runner.os }}" = "Windows" ]; then
            SIG_FILE=$(find "$BUNDLE_DIR/nsis" -name "*-setup.exe.sig" -type f | head -1)
          else
            SIG_FILE=$(find "$BUNDLE_DIR" -name "*.sig" -type f | head -1)
          fi
          if [ -z "$SIG_FILE" ]; then
            echo "::error::No .sig file found in $BUNDLE_DIR"
            find "$BUNDLE_DIR" -type f
            exit 1
          fi
          SIGNATURE=$(cat "$SIG_FILE")

          SIG_BASENAME=$(basename "$SIG_FILE")
          ARCHIVE_NAME="${SIG_BASENAME%.sig}"
          # macOS两个 target 上传时按架构重命名了，url 也要指向重命名后的文件
          case "$TARGET" in
            aarch64-apple-darwin) ARCHIVE_NAME="${ARCHIVE_NAME%.app.tar.gz}-aarch64.app.tar.gz" ;;
            x86_64-apple-darwin)  ARCHIVE_NAME="${ARCHIVE_NAME%.app.tar.gz}-x86_64.app.tar.gz" ;;
          esac
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${ARCHIVE_NAME}"

          echo "Platform:  $PLATFORM_KEY"
          echo "Signature: ${SIGNATURE:0:20}..."
          echo "URL:       $DOWNLOAD_URL"

          export PLATFORM_KEY SIGNATURE DOWNLOAD_URL VERSION
          node -e "
            const fragment = {
              version: process.env.VERSION,
              platforms: {
                [process.env.PLATFORM_KEY]: {
                  signature: process.env.SIGNATURE,
                  url: process.env.DOWNLOAD_URL
                }
              }
            };
            console.log(JSON.stringify(fragment, null, 2));
          " > "fragment-${PLATFORM_KEY}.json"

          gh release upload "$TAG" "fragment-${PLATFORM_KEY}.json" --clobber --repo "$REPO"
          echo "OK Fragment uploaded for $PLATFORM_KEY"

  merge-manifest:
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          VERSION=$(printf '%s' "$VERSION" | sed 's/^v//' | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Merge fragments into latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          VERSION="${{ steps.ver.outputs.version }}"
          REPO="${{ github.repository }}"

          mkdir -p fragments
          gh release download "$TAG" --repo "$REPO" --pattern "fragment-*.json" --dir fragments 2>/dev/null || true

          FRAGMENT_COUNT=$(find fragments -name "fragment-*.json" | wc -l)
          echo "Found $FRAGMENT_COUNT fragment(s)"
          if [ "$FRAGMENT_COUNT" -eq 0 ]; then
            echo "::error::No fragment files found"
            exit 1
          fi

          export VERSION
          node -e "
            const fs = require('fs');
            const path = require('path');
            const version = process.env.VERSION;
            const platforms = {};
            for (const f of fs.readdirSync('fragments')) {
              if (!f.startsWith('fragment-')) continue;
              const frag = JSON.parse(fs.readFileSync(path.join('fragments', f)));
              Object.assign(platforms, frag.platforms);
              console.log('  merged:', f);
            }
            const manifest = {
              version,
              pub_date: new Date().toISOString(),
              notes: 'See the assets below to download and install this version.',
              platforms
            };
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
            console.log('--- latest.json ---');
            console.log(JSON.stringify(manifest, null, 2));
          "

          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
          echo "OK latest.json uploaded"

          # 清理 release 中的 fragment 文件
          for f in fragments/fragment-*.json; do
            [ -f "$f" ] || continue
            BASENAME=$(basename "$f")
            ASSET_ID=$(gh api repos/${REPO}/releases --jq ".[] | select(.tag_name==\"$TAG\") | .assets[] | select(.name==\"$BASENAME\") | .id" 2>/dev/null)
            [ -n "$ASSET_ID" ] && gh api --method DELETE repos/${REPO}/releases/assets/$ASSET_ID 2>/dev/null || true
          done
          echo "OK Fragment files cleaned up"

  # 所有打包（publish）与更新清单合并（merge-manifest）结束后回调外部接口。
  # 依赖 secrets.CALLBACK_URL（必填）与 secrets.CALLBACK_TOKEN（可选，Bearer）。
  # 未配置 CALLBACK_URL 时自动跳过；接口异常只记 warning，不会把已完成的发布标记为失败。
  notify:
    needs: [publish, merge-manifest]
    # 成功、失败都通知；workflow 被手动取消时不通知
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    env:
      CALLBACK_URL: ${{ secrets.CALLBACK_URL }}
      CALLBACK_TOKEN: ${{ secrets.CALLBACK_TOKEN }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      MERGE_RESULT: ${{ needs['merge-manifest'].result }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          VERSION=$(printf '%s' "$VERSION" | sed 's/^v//' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Warn when callback URL is missing
        if: ${{ env.CALLBACK_URL == '' }}
        run: echo "::warning::未配置 secrets.CALLBACK_URL，跳过发布回调接口"

      - name: POST release callback
        if: ${{ env.CALLBACK_URL != '' }}
        continue-on-error: true
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          TAG="v${VERSION}"
          SUCCESS=false
          if [ "$PUBLISH_RESULT" = "success" ] && [ "$MERGE_RESULT" = "success" ]; then
            SUCCESS=true
          fi

          BODY=$(jq -n \
            --arg event "release.completed" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runNumber "$GITHUB_RUN_NUMBER" \
            --arg runUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg releaseUrl "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --arg occurredAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson success "$SUCCESS" \
            --argjson jobs "$NEEDS_JSON" \
            '{
               event: $event,
               repository: $repository,
               version: $version,
               tag: $tag,
               ref: $ref,
               sha: $sha,
               success: $success,
               jobs: $jobs,
               workflow: $workflow,
               event_name: $eventName,
               run_id: $runId,
               run_number: $runNumber,
               run_url: $runUrl,
               release_url: $releaseUrl,
               occurred_at: $occurredAt
             }')

          echo "POST $CALLBACK_URL"
          echo "$BODY" | jq .

          HEADERS=(-H "Content-Type: application/json"
            -H "X-GitHub-Event: release.completed"
            -H "Idempotency-Key: ${GITHUB_RUN_ID}")
          if [ -n "${CALLBACK_TOKEN:-}" ]; then
            HEADERS+=(-H "Authorization: Bearer ${CALLBACK_TOKEN}")
          fi

          HTTP_CODE=$(curl -sS -o callback-response.txt -w '%{http_code}' \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 5 --max-time 20 \
            -X POST "$CALLBACK_URL" "${HEADERS[@]}" \
            --data-binary "$BODY") || {
            echo "::warning::回调请求失败（网络错误或超时）"
            exit 1
          }

          echo "HTTP $HTTP_CODE"
          cat callback-response.txt || true

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::warning::回调接口返回 HTTP $HTTP_CODE"
            exit 1
          fi
